services:
  trekmail-mcp:
    build: .
    stdin_open: true
    environment:
      - TREKMAIL_BASE_URL=${TREKMAIL_BASE_URL}
      - TREKMAIL_API_TOKEN=${TREKMAIL_API_TOKEN:-}
      - TREKMAIL_MESSAGE_TOKEN=${TREKMAIL_MESSAGE_TOKEN:-}
      - TREKMAIL_TIMEOUT_MS=${TREKMAIL_TIMEOUT_MS:-30000}
      - TREKMAIL_USER_AGENT=${TREKMAIL_USER_AGENT:-trekmail-mcp/1.0.0}
      - TREKMAIL_ALLOW_DESTRUCTIVE=${TREKMAIL_ALLOW_DESTRUCTIVE:-false}
      - TREKMAIL_ALLOW_SENDING=${TREKMAIL_ALLOW_SENDING:-false}
